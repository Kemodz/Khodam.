<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Astri 💖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  height:100vh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:#fff;text-align:center;
}
#main{position:absolute;width:100%;height:100%;top:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
h1{font-family:'Pacifico',cursive;font-size:2.5rem;margin-bottom:20px;animation:glow 2s infinite alternate;}
@keyframes glow{from{text-shadow:0 0 10px #fff,0 0 20px #ff6f91;}to{text-shadow:0 0 20px #fff,0 0 40px #ff6f91;}}
.foto{width:180px;height:180px;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 40px rgba(255,255,255,0.8);margin:20px;animation:pulse 2s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}
#gombal{font-size:1.3rem;line-height:1.6;min-height:60px;padding:0 10px;}
.cursor{display:inline-block;width:3px;background:#fff;animation:blink 1s infinite;vertical-align:middle;}
@keyframes blink{50%{background:transparent;}}
button{background:#ff4f81;color:#fff;border:none;padding:10px 20px;border-radius:30px;margin-top:15px;font-size:1rem;cursor:pointer;transition:.3s}
button:hover{background:#ff7fa1;transform:scale(1.05);}
/* hearts */
.heart{position:absolute;width:20px;height:20px;background:#ff4f81;transform:rotate(45deg);animation:float 7s linear infinite;opacity:.8;}
.heart::before,.heart::after{content:'';position:absolute;width:20px;height:20px;background:#ff4f81;border-radius:50%;}
.heart::before{top:-10px;left:0;}
.heart::after{left:-10px;top:0;}
@keyframes float{0%{transform:translateY(100vh) rotate(45deg);}100%{transform:translateY(-110vh) rotate(45deg);}}
/* confetti */
.confetti{position:absolute;width:10px;height:10px;background:red;top:0;opacity:.8;animation:jatuh 4s linear forwards;}
@keyframes jatuh{to{transform:translateY(100vh) rotate(720deg);opacity:0;}}
/* love big surprise */
.love-explode{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:5rem;animation:boom 1s forwards;z-index:100;}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(0);}60%{transform:translate(-50%,-50%) scale(1.6);}100%{transform:translate(-50%,-50%) scale(1);}}
/* pelukan layar penuh */
#peluk{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,79,129,0.95);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:'Pacifico',cursive;font-size:2rem;z-index:200;opacity:0;pointer-events:none;transition:all 0.8s;}
#peluk img{width:150px;height:150px;object-fit:cover;border-radius:50%;border:6px solid #fff;margin-bottom:20px;}
</style>
</head>
<body>
<div id="main">
  <h1 id="judul"></h1>
  <img src="" id="fotoView" class="foto">
  <p id="gombal"></p><span class="cursor"></span>
  <button onclick="peluk()">🤗 Peluk Aku</button>
</div>

<div id="peluk">
  <img id="fotoPeluk" src="">
  <p id="teksPeluk">Aku sayang kamu selamanya! 💖</p>
</div>

<audio id="musik" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" loop></audio>
<audio id="pop" src="https://www.myinstants.com/media/sounds/pop.mp3"></audio>

<script>
// Nama & foto langsung otomatis
const namaPasangan = "Astri 🌸";
const fotoPasangan = "https://cdn.discordapp.com/attachments/1290285205655126036/1400329958471110838/IMG-20250421-WA0429.jpg?ex=688c3e66&is=688aece6&hm=7a29bd7ffe1f71bc3d024c422d2056e2f822eef22ee5e34a872ff88ef67b0eeb&";

// Array gombalan
const gombalan=[
 "Astri bikin dunia ini lebih indah setiap hari 🌈",
 "Aku selalu bersyukur karena kamu ada di hidupku 🙏",
 "Aku nggak mau apa-apa... cuma mau kamu bahagia 💕",
 "Setiap detik sama kamu adalah hadiah terindah 🎁",
 "Aku janji nggak ada hari tanpa aku sayang kamu ✨",
 "Kamu itu rumahku... tempatku kembali 🏡"
];

let index=0;
const teks=document.getElementById("gombal");
const cursor=document.querySelector(".cursor");
const judul=document.getElementById("judul");
const fotoView=document.getElementById("fotoView");
const fotoPeluk=document.getElementById("fotoPeluk");

function ketikTeks(teksGombal){
 let i=0;teks.innerHTML="";cursor.style.display="inline-block";
 const interval=setInterval(()=>{
   teks.innerHTML+=teksGombal[i];
   i++;
   if(i>=teksGombal.length){clearInterval(interval);cursor.style.display="none";}
 },50);
}

function gombalOtomatis(){
 ketikTeks(gombalan[index]);
 index=(index+1)%gombalan.length;
 setTimeout(gombalOtomatis,5000);
}

function buatHeart(){
 const heart=document.createElement("div");
 heart.classList.add("heart");
 heart.style.left=Math.random()*window.innerWidth+"px";
 heart.style.animationDuration=(5+Math.random()*3)+"s";
 document.body.appendChild(heart);
 setTimeout(()=>heart.remove(),8000);
}

function tambahConfetti(){
 for(let i=0;i<25;i++){
   const conf=document.createElement("div");
   conf.classList.add("confetti");
   conf.style.left=Math.random()*window.innerWidth+"px";
   conf.style.background=`hsl(${Math.random()*360},70%,60%)`;
   conf.style.animationDuration=(2+Math.random()*2)+"s";
   document.body.appendChild(conf);
   setTimeout(()=>conf.remove(),4000);
 }
}

function bigLove(){
 const love=document.createElement("div");
 love.classList.add("love-explode");
 love.innerHTML="💞";
 document.body.appendChild(love);
 document.getElementById("pop").play();
 setTimeout(()=>love.remove(),2000);
}

function peluk(){
 const pelukDiv=document.getElementById("peluk");
 pelukDiv.style.opacity="1";
 pelukDiv.style.pointerEvents="all";
 document.getElementById("teksPeluk").innerText=`${namaPasangan}, aku peluk kamu erat-erat! 🤗💖`;
 setTimeout(()=>{
   pelukDiv.style.opacity="0";
   pelukDiv.style.pointerEvents="none";
 },4000);
}

// Jalankan otomatis saat buka halaman
window.onload = ()=>{
 judul.innerHTML=`💖 Selamat Hari Girlfriend Day, ${namaPasangan}! 💖`;
 fotoView.src = fotoPasangan;
 fotoPeluk.src = fotoPasangan;
 document.getElementById("musik").play();
 gombalOtomatis();
 setInterval(buatHeart,200);
 setInterval(tambahConfetti,3000);
 setInterval(bigLove,8000);
}
</script>
</body>
</html>
